<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareList - Google Sheet Edition</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 横スクロールバーの非表示化 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-950 min-h-screen p-4 text-gray-100 relative selection:bg-blue-600 selection:text-white">

  <!-- メインカードコンテナ -->
  <div class="max-w-md mx-auto bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-5 relative">
    
    <!-- ヘッダー（タイトル & スプレッドシート設定ボタン） -->
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-2xl font-extrabold text-blue-400 tracking-tight flex items-center gap-2">
        <i class="fa-solid fa-file-excel text-green-500"></i> ShareList
      </h1>
      <div class="flex items-center gap-2">
        <!-- 同期ステータス表示 -->
        <span id="sync-status" class="text-[11px] px-2.5 py-1 rounded-full bg-gray-800 text-gray-400 border border-gray-700 flex items-center gap-1.5">
          <i class="fa-solid fa-database text-xs text-gray-500"></i> ローカル
        </span>
        <!-- 設定ボタン -->
        <button 
          id="open-settings-btn"
          class="p-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 transition"
          title="Googleスプレッドシート連携設定"
        >
          <i class="fa-solid fa-gear text-sm"></i>
        </button>
      </div>
    </div>

    <!-- GAS URL設定モーダル（初期は非表示） -->
    <div id="settings-modal" class="hidden mb-4 p-4 bg-gray-800/90 border border-blue-500/40 rounded-xl shadow-lg transition-all">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-sm font-bold text-blue-400 flex items-center gap-1.5">
          <i class="fa-solid fa-table text-green-400"></i> Googleスプレッドシート連携
        </h3>
        <button id="close-settings-btn" class="text-gray-400 hover:text-white text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <p class="text-xs text-gray-400 mb-3 leading-relaxed">
        Google Apps Script (GAS) の「ウェブアプリ URL」を入力すると、スプレッドシートとリアルタイム同期できます。
      </p>
      <div class="space-y-2">
        <input 
          id="gas-url-input" 
          type="text" 
          placeholder="https://script.google.com/macros/s/.../exec"
          class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
        >
        <div class="flex gap-2">
          <button 
            id="save-gas-url-btn" 
            class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-1.5 px-3 rounded-lg text-xs transition"
          >
            URLを保存して接続
          </button>
          <button 
            id="clear-gas-url-btn" 
            class="bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium py-1.5 px-3 rounded-lg text-xs transition"
          >
            解除
          </button>
        </div>
      </div>
    </div>

    <!-- カテゴリータブコンテナ -->
    <div class="flex items-center gap-1.5 border-b border-gray-800 overflow-x-auto pb-2 mb-4 no-scrollbar" id="tab-container">
      <!-- Dynamic Javascript Content -->
    </div>

    <!-- リストヘッダー -->
    <div class="flex items-center justify-between mb-3 px-1">
      <span id="current-category-title" class="text-sm font-bold text-gray-400 uppercase tracking-wider">
        食品
      </span>
      <button 
        id="toggle-completed-btn" 
        class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition flex items-center gap-1.5 border border-gray-700"
        title="完了済み項目の表示/非表示を切り替え"
      >
        <i id="toggle-eye-icon" class="fa-solid fa-eye-slash text-gray-400"></i>
        <span id="toggle-completed-text">完了済みを隠す</span>
      </button>
    </div>

    <!-- 買い物リスト -->
    <ul id="shopping-list" class="space-y-3">
      <!-- Dynamic Javascript Content -->
    </ul>

    <!-- リスト直下の追加エリア -->
    <div id="add-area-container" class="mt-4">
      
      <!-- 「＋ 項目を追加する」ボタン -->
      <button 
        id="open-input-btn"
        type="button"
        class="w-full p-3.5 border-2 border-dashed border-blue-500/40 hover:border-blue-400 bg-blue-950/30 hover:bg-blue-950/50 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 text-blue-400 font-bold group shadow-sm active:scale-[0.99]"
      >
        <div class="w-7 h-7 rounded-lg bg-blue-600 group-hover:bg-blue-500 text-white flex items-center justify-center transition shadow">
          <i class="fa-solid fa-plus text-sm"></i>
        </div>
        <span>項目を追加する</span>
      </button>

      <!-- インライン入力バー -->
      <div id="inline-input-bar" class="hidden bg-gray-800/80 border border-gray-700 rounded-xl p-3.5 shadow-inner">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-blue-400 flex items-center gap-1">
            <i class="fa-solid fa-pen text-xs"></i> 新しい項目を入力
          </span>
          <button id="close-input-btn" type="button" class="text-gray-400 hover:text-gray-200 p-1 text-xs font-medium">
            <i class="fa-solid fa-xmark"></i> 閉じる
          </button>
        </div>

        <form id="add-item-form" onsubmit="return false;" class="flex flex-col gap-2">
          <input 
            id="new-item-input" 
            type="text" 
            placeholder="買うものを入力..." 
            autocomplete="off"
            class="w-full p-3 border border-gray-700 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-gray-900 text-gray-100 placeholder-gray-500"
          >
          <button 
            id="submit-item-btn"
            type="submit" 
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 active:scale-95"
          >
            <i class="fa-solid fa-plus"></i> 追加する
          </button>
        </form>
      </div>

    </div>

  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // 状態管理変数
    let categories = ['食品', '日用品', 'その他'];
    let activeTab = '食品';
    let items = [];
    let isAddingTab = false;
    let showCompleted = true;

    // Google Apps Script Web App URL
    let gasWebAppUrl = localStorage.getItem('sharelist_gas_url') || '';

    // カテゴリ復元
    const savedCats = localStorage.getItem('sharelist_categories');
    if (savedCats) {
      try {
        const parsed = JSON.parse(savedCats);
        if (Array.isArray(parsed) && parsed.length > 0) {
          categories = parsed;
          activeTab = categories[0];
        }
      } catch (e) {
        console.error("Failed to parse saved categories", e);
      }
    }

    // ローカルアイテム復元
    const savedItems = localStorage.getItem('sharelist_local_items');
    if (savedItems) {
      try {
        items = JSON.parse(savedItems);
      } catch (e) {
        items = [];
      }
    }

    function saveCategories() {
      localStorage.setItem('sharelist_categories', JSON.stringify(categories));
    }

    function saveLocalItems() {
      localStorage.setItem('sharelist_local_items', JSON.stringify(items));
    }

    async function fetchItemsFromSheet() {
      if (!gasWebAppUrl) {
        updateSyncStatus('local');
        renderApp();
        return;
      }

      updateSyncStatus('syncing');
      try {
        const response = await fetch(gasWebAppUrl);
        if (!response.ok) throw new Error('Fetch failed');
        const data = await response.json();
        
        if (Array.isArray(data)) {
          items = data;
          saveLocalItems();
          updateSyncStatus('online');
        }
      } catch (err) {
        console.warn("Spreadsheet sync error, using local fallback:", err);
        updateSyncStatus('error');
      } finally {
        renderApp();
      }
    }

    async function sendToSheet(payload) {
      if (!gasWebAppUrl) return;

      try {
        await fetch(gasWebAppUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Failed to send data to Google Sheet:", err);
      }
    }

    function updateSyncStatus(status) {
      const el = document.getElementById('sync-status');
      if (!el) return;

      if (status === 'online') {
        el.innerHTML = '<i class="fa-solid fa-cloud-check text-xs text-green-400"></i> スプレッドシート同期中';
        el.className = 'text-[11px] px-2.5 py-1 rounded-full bg-green-950/60 text-green-300 border border-green-800/60 flex items-center gap-1.5';
      } else if (status === 'syncing') {
        el.innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin text-xs text-blue-400"></i> 同期中...';
        el.className = 'text-[11px] px-2.5 py-1 rounded-full bg-blue-950/60 text-blue-300 border border-blue-800/60 flex items-center gap-1.5';
      } else if (status === 'error') {
        el.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-xs text-amber-400"></i> オフライン保存';
        el.className = 'text-[11px] px-2.5 py-1 rounded-full bg-amber-950/60 text-amber-300 border border-amber-800/60 flex items-center gap-1.5';
      } else {
        el.innerHTML = '<i class="fa-solid fa-database text-xs text-gray-500"></i> ローカル保存';
        el.className = 'text-[11px] px-2.5 py-1 rounded-full bg-gray-800 text-gray-400 border border-gray-700 flex items-center gap-1.5';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const gasInput = document.getElementById('gas-url-input');
      if (gasInput) gasInput.value = gasWebAppUrl;

      // 初回描画（画面表示を確保）
      renderApp();

      // スプレッドシートからデータ取得
      fetchItemsFromSheet();
    });

    // モーダルの開閉
    const settingsModal = document.getElementById('settings-modal');
    document.getElementById('open-settings-btn').addEventListener('click', () => {
      settingsModal.classList.toggle('hidden');
    });
    document.getElementById('close-settings-btn').addEventListener('click', () => {
      settingsModal.classList.add('hidden');
    });

    // URLの保存・解除
    document.getElementById('save-gas-url-btn').addEventListener('click', () => {
      const url = document.getElementById('gas-url-input').value.trim();
      gasWebAppUrl = url;
      localStorage.setItem('sharelist_gas_url', url);
      settingsModal.classList.add('hidden');
      fetchItemsFromSheet();
    });

    document.getElementById('clear-gas-url-btn').addEventListener('click', () => {
      gasWebAppUrl = '';
      localStorage.removeItem('sharelist_gas_url');
      document.getElementById('gas-url-input').value = '';
      settingsModal.classList.add('hidden');
      updateSyncStatus('local');
      renderApp();
    });

    function renderApp() {
      renderTabs();
      renderItems();
      updateHeaderAndToggleUI();
    }

    function updateHeaderAndToggleUI() {
      const categoryTitle = document.getElementById('current-category-title');
      if (categoryTitle) categoryTitle.textContent = activeTab;

      const eyeIcon = document.getElementById('toggle-eye-icon');
      const toggleText = document.getElementById('toggle-completed-text');

      if (showCompleted) {
        eyeIcon.className = 'fa-solid fa-eye-slash text-gray-400';
        toggleText.textContent = '完了済みを隠す';
      } else {
        eyeIcon.className = 'fa-solid fa-eye text-blue-400';
        toggleText.textContent = '完了済みを表示';
      }
    }

    document.getElementById('toggle-completed-btn').addEventListener('click', () => {
      showCompleted = !showCompleted;
      renderApp();
    });

    function renderTabs() {
      const tabContainer = document.getElementById('tab-container');
      tabContainer.innerHTML = '';

      categories.forEach(cat => {
        const isActive = activeTab === cat;
        const tabWrapper = document.createElement('div');
        tabWrapper.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-sm font-semibold transition cursor-pointer select-none border ${
          isActive 
            ? 'bg-blue-600 text-white border-blue-500 shadow-sm' 
            : 'bg-gray-800 text-gray-300 border-gray-700 hover:bg-gray-750'
        }`;

        const labelSpan = document.createElement('span');
        labelSpan.textContent = cat;
        labelSpan.onclick = () => {
          activeTab = cat;
          isAddingTab = false;
          closeInlineInput();
          renderApp();
        };
        tabWrapper.appendChild(labelSpan);

        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.innerHTML = '<i class="fa-solid fa-xmark text-xs"></i>';
        closeBtn.className = `p-1 rounded-full leading-none transition ${
          isActive 
            ? 'hover:bg-blue-700 text-blue-200' 
            : 'hover:bg-gray-700 text-gray-400 hover:text-gray-200'
        }`;
        closeBtn.title = "タブを削除";
        closeBtn.onclick = (e) => {
          e.stopPropagation();
          deleteCategory(cat);
        };
        tabWrapper.appendChild(closeBtn);

        tabContainer.appendChild(tabWrapper);
      });

      if (isAddingTab) {
        const addForm = document.createElement('form');
        addForm.className = 'flex items-center gap-1';
        addForm.onsubmit = (e) => {
          e.preventDefault();
          const input = addForm.querySelector('input');
          const newCat = input.value.trim();
          if (newCat && !categories.includes(newCat)) {
            categories.push(newCat);
            activeTab = newCat;
            saveCategories();
          }
          isAddingTab = false;
          renderApp();
        };

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'タブ名...';
        input.className = 'px-2 py-1 border border-blue-500 rounded-lg text-xs outline-none w-20 bg-gray-900 text-white placeholder-gray-500';
        input.autofocus = true;
        
        input.onblur = () => {
          setTimeout(() => {
            if (isAddingTab) {
              isAddingTab = false;
              renderApp();
            }
          }, 150);
        };

        addForm.appendChild(input);
        tabContainer.appendChild(addForm);
        setTimeout(() => input.focus(), 0);
      } else {
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'flex items-center justify-center w-8 h-8 rounded-xl bg-gray-800 text-blue-400 hover:bg-gray-700 border border-gray-700 font-bold transition shrink-0';
        addBtn.innerHTML = '<i class="fa-solid fa-plus text-sm"></i>';
        addBtn.title = '新しいタブを追加';
        addBtn.onclick = () => {
          isAddingTab = true;
          renderApp();
        };
        tabContainer.appendChild(addBtn);
      }
    }

    function deleteCategory(catToDelete) {
      if (categories.length <= 1) return;
      categories = categories.filter(c => c !== catToDelete);
      saveCategories();
      if (activeTab === catToDelete) {
        activeTab = categories[0];
      }
      renderApp();
    }

    function renderItems() {
      const listEl = document.getElementById('shopping-list');
      listEl.innerHTML = '';

      let filteredItems = items.filter(item => item.category === activeTab);

      if (!showCompleted) {
        filteredItems = filteredItems.filter(item => !item.completed);
      }

      if (filteredItems.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-10 px-4 border-2 border-dashed border-gray-800 rounded-2xl">
            <i class="fa-solid fa-basket-shopping text-3xl text-gray-700 mb-2"></i>
            <p class="text-gray-500 text-sm font-medium">表示できる項目はありません</p>
          </div>
        `;
        return;
      }

      filteredItems.forEach(item => {
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-3.5 border rounded-xl shadow-sm transition ${
          item.completed ? 'bg-gray-900/60 border-gray-800/80' : 'bg-gray-800/70 border-gray-700/80 hover:border-gray-600'
        }`;

        li.innerHTML = `
          <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0 pr-2 select-none">
            <input 
              type="checkbox" 
              ${item.completed ? 'checked' : ''} 
              class="w-5 h-5 accent-blue-500 rounded cursor-pointer bg-gray-900 border-gray-700"
            >
            <span class="${item.completed ? 'line-through text-gray-500' : 'text-gray-200'} font-medium text-base truncate">
              ${escapeHtml(item.name)}
            </span>
          </label>
          <button type="button" class="delete-btn text-gray-500 hover:text-red-400 p-2 rounded-lg hover:bg-red-950/40 transition shrink-0">
            <i class="fa-regular fa-trash-can text-base"></i>
          </button>
        `;

        li.querySelector('input').addEventListener('change', () => {
          item.completed = !item.completed;
          saveLocalItems();
          renderApp();
          sendToSheet({ action: 'toggle', id: item.id, completed: item.completed });
        });

        li.querySelector('.delete-btn').addEventListener('click', () => {
          items = items.filter(i => i.id !== item.id);
          saveLocalItems();
          renderApp();
          sendToSheet({ action: 'delete', id: item.id });
        });

        listEl.appendChild(li);
      });
    }

    const openInputBtn = document.getElementById('open-input-btn');
    const closeInputBtn = document.getElementById('close-input-btn');
    const inlineInputBar = document.getElementById('inline-input-bar');
    const newItemInput = document.getElementById('new-item-input');
    const addItemForm = document.getElementById('add-item-form');

    function openInlineInput() {
      newItemInput.value = '';
      openInputBtn.classList.add('hidden');
      inlineInputBar.classList.remove('hidden');
      newItemInput.focus();
    }

    function closeInlineInput() {
      newItemInput.value = '';
      inlineInputBar.classList.add('hidden');
      openInputBtn.classList.remove('hidden');
    }

    openInputBtn.addEventListener('click', openInlineInput);
    closeInputBtn.addEventListener('click', closeInlineInput);

    function handleAddItem(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const name = newItemInput.value.trim();
      
      // 入力欄を直ちにクリア
      newItemInput.value = '';

      if (!name) {
        newItemInput.focus();
        return;
      }

      // 入力フォーカスを維持（連続入力対応）
      newItemInput.focus();

      const newItem = {
        id: 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
        name: name,
        category: activeTab,
        completed: false,
        createdAt: new Date().toISOString()
      };

      items.unshift(newItem);
      saveLocalItems();
      renderApp();

      sendToSheet({
        action: 'add',
        id: newItem.id,
        name: newItem.name,
        category: newItem.category
      });
    }

    addItemForm.addEventListener('submit', handleAddItem);

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
